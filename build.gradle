// ===================================================================
// build.gradle (nivel de MÓDULO "app")
// Aquí se configura específicamente cómo se compila la app:
// SDK objetivo, nombre del paquete, dependencias (librerías), etc.
// ===================================================================

// Aplicamos el plugin de Android para aplicaciones (no librerías)
apply plugin: 'com.android.application'

android {
    // Namespace / paquete base de la aplicación
    namespace 'com.example.mispeliculas'

    // Versión del SDK de Android usada para compilar (Android 14)
    compileSdk 34

    defaultConfig {
        // Identificador único de la app en el dispositivo / Play Store
        applicationId "com.example.mispeliculas"

        // Versión mínima de Android soportada (Android 7.0 Nougat)
        minSdk 24

        // Versión de Android para la que está "pensada" y probada la app
        targetSdk 34

        // Código interno de versión (se incrementa en cada publicación)
        versionCode 1

        // Nombre de versión visible para el usuario
        versionName "1.0"

        // Runner usado para pruebas instrumentadas (no usamos tests aquí,
        // pero se deja configurado por convención de Android Studio)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // No minificamos (ofuscamos) el código en esta versión académica
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Configuración del lenguaje Java usado en el proyecto
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Habilita "view binding" NO se usa aquí (usamos findViewById clásico
    // a propósito, para que el código sea más fácil de entender en un
    // trabajo final de curso), pero dejamos buildFeatures por si se desea activar.
    buildFeatures {
        viewBinding false
    }
}

dependencies {
    // ---------- Librerías básicas de AndroidX / Material ----------
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ---------- RecyclerView (listas eficientes) ----------
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // ---------- Fragmentos (Fragment + comunicación con Activity) ----------
    implementation 'androidx.fragment:fragment:1.6.2'

    // ---------- Retrofit: consumo de API REST ----------
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    // Convertidor Gson: transforma el JSON de la API en objetos Java automáticamente
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    // ---------- SwipeRefreshLayout (opcional, mejora UX) ----------
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
