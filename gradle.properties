# ===================================================================
# gradle.properties
# Configuraciones generales para la JVM y el comportamiento de Gradle.
# ===================================================================

# Memoria asignada a la JVM que ejecuta Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Usa AndroidX (librerías modernas de Android) en lugar de las antiguas
# librerías de soporte (android.support.*)
android.useAndroidX=true

# No convierte automáticamente librerías antiguas a AndroidX
# (no lo necesitamos porque solo usamos librerías ya migradas)
android.enableJetifier=false

# Habilita la compilación en paralelo de módulos (más velocidad)
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
